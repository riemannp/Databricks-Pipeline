# Ruff configuration for Databricks pipeline
line-length = 130

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]

ignore = [
    "BLE001",  # Blind exception catching (common in Databricks notebooks)
    "DTZ005",  # datetime.now() without tz (acceptable for pipeline timestamps)
    "S110",    # try-except-pass (acceptable in maintenance scripts)
]

[lint.isort]
known-first-party = ["utils"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
