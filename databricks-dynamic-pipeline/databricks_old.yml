bundle:
  name: databricks-dynamic-pipeline

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Production/pipelines/${bundle.name}

resources:
  jobs:
    ecom_medallion_job:
      name: ECom_Medallion_Pipeline
      job_clusters:
        - job_cluster_key: serverless
          new_cluster:
            num_workers: 0
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            runtime_engine: PHOTON
            data_security_mode: USER_ISOLATION
            aws_attributes:
              availability: ON_DEMAND
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"  # Daily at 2 AM UTC
        timezone_id: "UTC"
        pause_status: UNPAUSED
      
      # Email notifications for job status
      email_notifications:
        on_start:
          - panagiotiskoutridis@gmail.com
        on_success:
          - panagiotiskoutridis@gmail.com
        on_failure:
          - panagiotiskoutridis@gmail.com
        no_alert_for_skipped_runs: false
      
      # Global job settings
      max_concurrent_runs: 1
      timeout_seconds: 7200  # 2 hours total job timeout
      
      tasks:
        # Task 1: Export and validate configuration
        - task_key: export_config
          timeout_seconds: 300  # 5 minutes
          max_retries: 2
          notebook_task:
            notebook_path: src/00_config_exporter.py
            source: WORKSPACE
        
        # Task 2: Bronze layer - Ingest orders
        - task_key: bronze_orders
          timeout_seconds: 1800  # 30 minutes
          max_retries: 3
          depends_on:
            - task_key: export_config
          notebook_task:
            notebook_path: src/01_bronze.py
            source: WORKSPACE
            base_parameters:
              config_json: '{"source_name": "orders", "source_format": "csv", "source_path": "/Volumes/main/default/raw_landing/orders/", "read_options": {"header": "true"}}'
        
        # Task 3: Bronze layer - Ingest customers
        - task_key: bronze_customers
          timeout_seconds: 1800  # 30 minutes
          max_retries: 3
          depends_on:
            - task_key: export_config
          notebook_task:
            notebook_path: src/01_bronze.py
            source: WORKSPACE
            base_parameters:
              config_json: '{"source_name": "customers", "source_format": "csv", "source_path": "/Volumes/main/default/raw_landing/customers/", "read_options": {"header": "true"}}'
        
        # Task 4: Bronze layer - Ingest reviews
        - task_key: bronze_reviews
          timeout_seconds: 1800  # 30 minutes
          max_retries: 3
          depends_on:
            - task_key: export_config
          notebook_task:
            notebook_path: src/01_bronze.py
            source: WORKSPACE
            base_parameters:
              config_json: '{"source_name": "reviews", "source_format": "json", "source_path": "/Volumes/main/default/raw_landing/reviews/", "read_options": {"multiline": "false"}}'
        
        # Task 5: Silver layer - Transform orders
        - task_key: silver_orders
          timeout_seconds: 1800  # 30 minutes
          max_retries: 3
          depends_on:
            - task_key: bronze_orders
          notebook_task:
            notebook_path: src/02_silver.py
            source: WORKSPACE
            base_parameters:
              config_json:
              - '{"source_name": "orders", "silver_transform": {"mode": "overwrite", "drop_nulls": ["order_id"]}}'
        
        # Task 6: Silver layer - Transform customers
        - task_key: silver_customers
          timeout_seconds: 1800  # 30 minutes
          max_retries: 3
          depends_on:
            - task_key: bronze_customers
          notebook_task:
            notebook_path: src/02_silver.py
            source: WORKSPACE
            parameters:
              - '{"source_name": "customers", "silver_transform": {"mode": "overwrite", "drop_nulls": ["customer_id"]}}'
        
        # Task 7: Silver layer - Transform reviews
        - task_key: silver_reviews
          timeout_seconds: 1800  # 30 minutes
          max_retries: 3
          depends_on:
            - task_key: bronze_reviews
          notebook_task:
            notebook_path: src/02_silver.py
            source: WORKSPACE
            parameters:
              - '{"source_name": "reviews", "silver_transform": {"mode": "overwrite", "drop_nulls": ["review_id"]}}'
        
        # Task 8: Gold layer - Create analytics tables
        - task_key: gold_processing
          timeout_seconds: 2400  # 40 minutes
          max_retries: 2
          depends_on:
            - task_key: silver_orders
            - task_key: silver_customers
            - task_key: silver_reviews
          notebook_task:
            notebook_path: src/03_gold.py
            source: WORKSPACE
        
        # Task 9: Maintenance - Optimize all tables
        - task_key: maintenance
          timeout_seconds: 3600  # 60 minutes
          max_retries: 1
          depends_on:
            - task_key: gold_processing
          notebook_task:
            notebook_path: src/04_maintenance.py
            source: WORKSPACE